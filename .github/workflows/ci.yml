name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run coverage --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run build:platform --prefix frontend
      - run: npm run test:vite --prefix frontend
      - run: npm run build:embedded --prefix frontend
      - name: Verify embedded assets match source
        run: git diff --exit-code -- web
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-coverage
          path: frontend/coverage

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTDOCFLAGS: -D warnings
      COORDINATOR_TEST_DATABASE_URL: postgresql://cuttlefish_test@127.0.0.1:5432/cuttlefish_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up PostgreSQL on every supported OS
        uses: ankane/setup-postgres@1adb52d4692fddc409e252bd72c32904fd6ce9b4
        with:
          database: cuttlefish_test
          user: cuttlefish_test
      - name: Install pinned toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component clippy,rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Validate shell installers
        if: runner.os != 'Windows'
        run: |
          sh -n install.sh
          sh -n install/docker.sh
          sh -n install/relay.sh
          sh -n install/service-macos.sh
          python3 tests/install/service.py
          python3 tests/install/update.py
          bash -n deploy/relay/entrypoint.sh
          python3 experiments/relay/service_smoke.py
      - name: Verify real macOS login service lifecycle
        if: runner.os == 'macOS'
        run: python3 tests/install/service-macos-live.py
      - name: Validate PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('install.ps1', 'install/docker.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Unit and integration tests
        run: cargo test --workspace --all-targets --locked
      - name: Browser chat contracts
        if: runner.os == 'Linux'
        run: |
          export BROWSER_BIN="$(command -v google-chrome)"
          node tests/web/chat.mjs
          CHAT_TEST_BASE=/i/00000000-0000-0000-0000-000000000123 node tests/web/chat.mjs
      - name: Documentation tests
        run: cargo test --workspace --doc --locked
      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked

  coverage:
    name: Full source coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: orchestrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orchestrator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COORDINATOR_TEST_DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/orchestrator_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned toolchain and coverage driver
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Enforce 100 percent line, function, and region coverage
        run: cargo coverage --features cuttlefish-machine/docker-tests --locked
      - name: Render report
        if: always()
        run: cargo llvm-cov report --html --output-dir target/coverage --ignore-filename-regex /tests/
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: target/coverage
          if-no-files-found: warn
