[workspace]
members = ["crates/protocol", "crates/domain", "crates/agents", "crates/node", "crates/coordinator", "crates/prompts", "crates/platform", "crates/machine"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.7"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
base64 = "0.22.1"
orchestrator-prompts = { path = "crates/prompts" }
orchestrator-protocol = { path = "crates/protocol" }
orchestrator-domain = { path = "crates/domain" }
orchestrator-agents = { path = "crates/agents" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["serde"] }
tokio = { version = "1.0", features = ["macros", "rt"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
clap = { version = "4.6", features = ["derive"] }
tempfile = "3.27"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
sha2 = "0.10.9"
tower = { version = "0.5", features = ["util"] }
argon2 = { version = "0.6.0", features = ["getrandom"] }
orchestrator-coordinator = { path = "crates/coordinator" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
